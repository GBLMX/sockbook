[package]
name = "sockbook"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Offline-first Linux socket inspector with an embedded port/service knowledge base"
repository = "https://github.com/GBLMX/sockbook"
license = "MIT"
readme = "README.md"

[dependencies]
bitflags = "2"
clap = { version = "4.6.7", features = ["derive"] }
netstat2 = "0.11.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-width = "0.2"
ureq = { version = "3.5.2", optional = true }

[features]
default = []
web = ["dep:ureq"]

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
